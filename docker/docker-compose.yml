services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-siuji}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?isi DB_PASSWORD di .env -- lihat .env.docker.example}"
      POSTGRES_DB: ${DB_NAME:-siuji_db}
    # Mount ke /var/lib/postgresql (folder induk), BUKAN /var/lib/postgresql/data
    # -- wajib sejak image resmi Postgres 18: mount langsung ke .../data
    # ditolak start sama sekali (lihat docker-library/postgres#1259), karena
    # 18+ menaruh data di subfolder bernama versi major (mis. .../18/docker)
    # supaya pg_upgrade antar versi major bisa jalan bersih.
    volumes:
      - siuji_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-siuji}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Image resmi Siuji -- dibuild & dipublikasikan otomatis lewat GitHub
    # Actions (release.yml di repo arrido92/siuji) tiap kali ada rilis versi
    # baru. Ganti tag ":latest" jadi versi tertentu (mis. ":1.3.0") kalau mau
    # mengunci versi, bukan otomatis ikut versi terbaru.
    image: ghcr.io/arrido92/siuji:latest
    restart: unless-stopped
    # Label dibaca watchtower (WATCHTOWER_LABEL_ENABLE=true di bawah) --
    # HANYA container berlabel ini yang boleh disentuh watchtower, "db"
    # SENGAJA tidak dilabeli supaya Postgres TIDAK PERNAH ikut auto-pull.
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: '8080'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-siuji}
      DB_PASSWORD: "${DB_PASSWORD:?isi DB_PASSWORD di .env -- lihat .env.docker.example}"
      DB_NAME: ${DB_NAME:-siuji_db}
      DB_SSLMODE: disable
      JWT_SECRET: "${JWT_SECRET:?isi JWT_SECRET di .env -- generate lewat 'openssl rand -hex 32'}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@siuji.local}
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di .env dengan password kuat}"
      LICENSE_CHECKIN_URL: ${LICENSE_CHECKIN_URL:-}
      # Dipakai tombol "Update Sekarang" di panel admin (lihat
      # cmd/api/update_docker.go) untuk memanggil HTTP API watchtower di
      # bawah -- token yang SAMA harus cocok dengan punya watchtower.
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_HTTP_API_TOKEN:?isi WATCHTOWER_HTTP_API_TOKEN di .env -- generate lewat 'openssl rand -hex 32'}"
    volumes:
      - siuji_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # watchtower: SATU-SATUNYA container yang pegang akses Docker socket VPS
  # (lihat volumes di bawah) -- container "app" SENGAJA TIDAK PERNAH diberi
  # akses ini sendiri (kalau app punya celah keamanan, dampaknya tidak
  # sampai memberi penyerang kendali atas seluruh VPS). app cuma "minta
  # tolong" lewat HTTP API watchtower (jaringan internal compose, TIDAK
  # dipublikasikan ke host/internet) saat admin klik "Update Sekarang" --
  # lihat cmd/api/update_docker.go.
  #
  # Image "nickfedor/watchtower" (fork aktif, BUKAN "containrrr/watchtower"
  # asli -- yang itu sudah 2+ tahun tidak dirawat & TERBUKTI rusak di Docker
  # 29+, error "client version 1.25 is too old", dites nyata 2026-08-13).
  # README fork ini sendiri bilang "tidak direkomendasikan produksi" --
  # itu soal skenario auto-update background diam-diam (mode default kalau
  # dikonfigurasi polling berkala), BUKAN cara kita pakai di sini.
  #
  # WATCHTOWER_HTTP_API_UPDATE=true mematikan polling otomatis berkala
  # (perilaku default library ini) -- update HANYA terjadi saat diminta
  # eksplisit lewat API, TIDAK PERNAH diam-diam di background tanpa admin
  # klik tombol.
  watchtower:
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: 'true'
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_HTTP_API_TOKEN:?isi WATCHTOWER_HTTP_API_TOKEN di .env -- generate lewat 'openssl rand -hex 32'}"
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_NO_STARTUP_MESSAGE: 'true'

volumes:
  siuji_pgdata:
  siuji_data:
