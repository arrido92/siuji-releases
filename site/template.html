<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kebijakan Privasi — Siuji</title>
<meta name="description" content="Kebijakan Privasi aplikasi Siuji (Nifadigital)" />
<style>
  :root {
    --ink: #1b2130;
    --ink-soft: #4a5468;
    --paper: #fdfcf9;
    --accent: #2f6fed;
    --rule: #e4e0d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.65; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 24px 96px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(155deg, #2f6fed, #1c48c9); flex-shrink: 0; }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .content h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.01em; }
  .content > p:first-of-type em { color: var(--ink-soft); font-size: 14px; font-style: normal; }
  .content h2 { font-size: 20px; margin: 44px 0 14px; padding-top: 22px; border-top: 1px solid var(--rule); letter-spacing: -0.005em; }
  .content h2:first-of-type { border-top: none; padding-top: 0; }
  .content p { margin: 0 0 14px; max-width: 66ch; }
  .content ul { margin: 0 0 14px; padding-left: 22px; max-width: 66ch; }
  .content li { margin-bottom: 6px; }
  .content strong { font-weight: 600; }
  .content a { color: var(--accent); }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-name">Siuji</div>
    </div>
    <div class="content">
      {{CONTENT}}
    </div>
    <footer>&copy; 2026 Nifadigital — Siuji</footer>
  </div>
</body>
</html>
